name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Only production dependencies are included in the deployed application.
      # Fail on moderate-or-higher advisories; audit full dev dependency tree separately.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run build
